name: DB migrate

# OPTIONNEL. Applique les migrations de db/migrations sur Supabase.
# Déclenchement manuel uniquement, derrière l'environnement « production »
# (activez-y « Required reviewers » pour exiger une approbation).
# Secret requis dans cet environnement : SUPABASE_DB_URL
# (chaîne de connexion « Session pooler » de Supabase, compatible IPv4).
# Ce workflow n'affiche que des noms de fichiers : les journaux d'un dépôt public sont publics.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Client PostgreSQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Appliquer les migrations
        run: bash scripts/migrate.sh
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
